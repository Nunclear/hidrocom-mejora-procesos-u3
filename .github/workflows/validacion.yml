name: Validación documental
on:
  push:
    branches: [main, codex/integracion-calidad]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-validacion.txt
      - run: python -m pip install -r requirements-validacion.txt
      - run: python herramientas/ejecutar_pruebas.py
      - run: python herramientas/validar_integracion.py --final --revision "$GITHUB_SHA"
